<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý công việc - Tổ Kỹ thuật điện &amp; IC</title>
<style>
:root{--pri:#0b5394;--pri2:#e8f0fa;--bd:#d5dbe3;--tx:#1f2933;--mut:#6b7785;--ok:#1e8e3e;--warn:#e69500;--bad:#d93025;--bg:#f4f6f9}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;font-size:14px;color:var(--tx);background:var(--bg)}
header{background:var(--pri);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
header .sub{font-size:12px;opacity:.85}
header .sp{flex:1}
header .bk{font-size:12px;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:12px;cursor:pointer}
header .bk.warn{background:#e69500}
nav{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--bd);padding:0 12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
nav button{border:0;background:none;padding:12px 14px;font:inherit;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent}
nav button.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
main{padding:16px 20px;max-width:1600px;margin:0 auto}
.card{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px;color:var(--pri)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2>.card{margin-bottom:0}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:12px 14px}
.stat .v{font-size:26px;font-weight:700;color:var(--pri)}
.stat .l{color:var(--mut);font-size:12px}
.stat.bad .v{color:var(--bad)}.stat.ok .v{color:var(--ok)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .sp{flex:1}
.toolbar label{color:var(--mut);font-size:13px}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--bd);border-radius:5px;background:#fff;color:var(--tx)}
input:disabled{background:#f2f2f2}
textarea{width:100%;min-height:64px;resize:vertical}
.btn{font:inherit;padding:6px 12px;border:1px solid var(--bd);border-radius:5px;background:#fff;cursor:pointer;white-space:nowrap;color:var(--tx)}
.btn:hover{background:#eef2f7}
.btn.p{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.p:hover{background:#08427a}
.btn.d{color:var(--bad)}
.btn.s{padding:2px 8px;font-size:12px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--pri2);font-weight:600}
td.c,th.c{text-align:center}td.r,th.r{text-align:right}
tr:hover td{background:#fafcff}
.mut{color:var(--mut);font-size:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;white-space:nowrap}
.tag.ok{background:#e6f4ea;color:var(--ok)}.tag.b{background:#e8f0fe;color:#1a56b8}.tag.g{background:#eceff1;color:#555}.tag.bad{background:#fce8e6;color:var(--bad)}.tag.w{background:#fff3e0;color:#b26a00}
.bar{height:8px;background:#e5e9ef;border-radius:4px;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--pri)}
.bar.ok>i{background:var(--ok)}.bar.bad>i{background:var(--bad)}
.empty{padding:24px;text-align:center;color:var(--mut)}
.acts{white-space:nowrap}
.acts .btn{margin:1px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 10px}
#modal.show{display:flex}
.mbox{background:#fff;border-radius:8px;width:680px;max-width:100%;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.mbox.wide{width:960px}
.mbox.xwide{width:1240px}
.mhead{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center}
.mhead b{flex:1;font-size:15px;color:var(--pri)}
.mhead .x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--mut)}
.mbody{padding:14px 16px;max-height:70vh;overflow:auto}
.mfoot{padding:10px 16px;border-top:1px solid var(--bd);display:flex;gap:8px;align-items:center}
.mfoot .sp{flex:1}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld.full{grid-column:1/-1}
.fld>label{font-size:13px;color:var(--mut);font-weight:600}
.req{color:var(--bad)}
.multi{display:flex;flex-wrap:wrap;gap:4px 16px;padding:4px 0}
.multi label{font-weight:normal;color:var(--tx);cursor:pointer}
/* schedule grid */
.cal td,.cal th{padding:3px 2px;text-align:center;min-width:28px;font-size:12px}
.cal td.nm,.cal th.nm{text-align:left;min-width:150px;padding:4px 8px;font-size:13px;white-space:nowrap}
.cal th.we,.cal td.we{background:#f3f3f3}
.cal th.td{background:#ffe9a8}
.cal td.cell{cursor:pointer;height:30px}
.cal td.cell:hover{outline:2px solid var(--pri);outline-offset:-2px}
.cal td.has{color:#fff;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:12px}
.legend span i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:4px}
/* emulation */
.emu input[type=number]{width:62px;text-align:center;padding:4px}
.emu td{vertical-align:middle}
.emu td:nth-child(2){white-space:nowrap}
.grade{font-weight:700;font-size:15px}
.gA{color:var(--ok)}.gB{color:#1a56b8}.gC{color:#b26a00}.gD{color:var(--bad)}
.hist{border-left:3px solid var(--pri2);padding:4px 10px;margin:6px 0}
.hist .mut b{color:var(--tx)}
.warnbox{background:#fff3e0;border:1px solid #ffcc80;border-radius:6px;padding:8px 12px;margin-bottom:12px;color:#8a5200}
.help li{margin:4px 0}
@media print{
 header,nav,.toolbar,.noprint,.acts,#modal{display:none!important}
 body{background:#fff}main{padding:0;max-width:none}
 .card{border:0;padding:0}
 .ptitle{display:block!important}
}
.pchip{border-left:3px solid;background:#f7f9fc;padding:3px 6px;margin:2px 0;font-size:12px;border-radius:3px;cursor:pointer;min-width:90px}
.pchip:hover{background:#e8f0fa}
.pmx td{min-width:110px}
.seg{display:inline-flex;gap:0}.seg .btn{border-radius:0;margin-left:-1px}.seg .btn:first-child{border-radius:5px 0 0 5px}.seg .btn:last-child{border-radius:0 5px 5px 0}
.chart svg{max-width:560px;display:block}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px;margin-top:8px}
.chart{border:1px solid var(--bd);border-radius:8px;padding:10px 12px;background:#fff}
.chart .ct{font-weight:600;font-size:13px;margin-bottom:4px}
.clg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mut);margin-top:4px}
.clg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
#tip{position:fixed;display:none;background:#1f2933;color:#fff;font-size:12px;padding:6px 9px;border-radius:5px;white-space:pre-line;pointer-events:none;z-index:99;max-width:300px;line-height:1.45}
.att{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--bd)}
.attchip{display:inline-block;font-size:12px;background:#eef3fb;border-radius:10px;padding:1px 8px;margin:1px 0;text-decoration:none;white-space:nowrap}
#attv{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.attv-box{background:#fff;border-radius:8px;width:1000px;max-width:100%;overflow:hidden}.attv-box .mhead{gap:8px}
.wsum{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;background:#f7f9fc;border:1px solid var(--bd);border-radius:6px;padding:8px 10px;margin-bottom:10px;font-size:13px}
.wsum a{text-decoration:none;color:var(--tx);background:#fff;border:1px solid var(--bd);border-radius:12px;padding:2px 10px}.wsum a.on{background:var(--pri);color:#fff;border-color:var(--pri)}.wsum a.on span{color:#fff!important}
.stat.lk{cursor:pointer;transition:box-shadow .15s,border-color .15s}.stat.lk:hover{border-color:var(--pri);box-shadow:0 2px 8px rgba(11,83,148,.15)}.stat.lk .l:after{content:' ›';color:var(--pri)}
.stat.sel{border-color:var(--pri);box-shadow:inset 0 -3px 0 var(--pri)}
.grow td{background:#e8f0fa;font-weight:600;color:var(--pri)}
.ptitle{display:none;text-align:center;margin-bottom:10px}
/* ===== Giao diện màu (v2) ===== */
:root{--pri:#0d4f8b;--pri2:#dce8f6;--bd:#d3dbe6;--bg:#eef2f7;--ok:#1b7a34;--bad:#c62828}
header{background:linear-gradient(90deg,#0d4f8b,#1565c0)}
nav{box-shadow:0 1px 3px rgba(0,0,0,.06)}
nav button{border-radius:6px 6px 0 0;margin-top:4px}
nav button:hover{color:var(--pri);background:#f1f5fb}
nav button.on{background:#e8f0fa}
.card{border:0;box-shadow:0 1px 3px rgba(16,40,80,.08),0 1px 2px rgba(16,40,80,.04);border-top:3px solid #1565c0}
.chart{border:1px solid #e1e7ef}
th{background:#dce8f6;color:#0d3c6b}
table tr:nth-child(even)>td{background:#fafcfe}
tr:hover td{background:#f2f7fd}
.stat{border:0;border-left:5px solid #1565c0;box-shadow:0 1px 3px rgba(16,40,80,.08);background:linear-gradient(90deg,#f3f8fe,#fff 60%);position:relative}
.stat .ic{position:absolute;right:12px;top:10px;font-size:22px;opacity:.85}
.stat .v{color:#0d4f8b}
.stat.ok{border-left-color:#2e9d48;background:linear-gradient(90deg,#eef8f1,#fff 60%)}.stat.ok .v{color:#1b7a34}
.stat.bad{border-left-color:#e04848;background:linear-gradient(90deg,#fdf0ef,#fff 60%)}.stat.bad .v{color:#c62828}
.stat.pur{border-left-color:#6a4ce2;background:linear-gradient(90deg,#f3f0fd,#fff 60%)}.stat.pur .v{color:#4b33b5}
.stat.org{border-left-color:#ef8a1f;background:linear-gradient(90deg,#fef5ea,#fff 60%)}.stat.org .v{color:#b45f06}
.stat.tea{border-left-color:#00a389;background:linear-gradient(90deg,#e9f8f5,#fff 60%)}.stat.tea .v{color:#00796b}
.tag.ok{background:#dff3e5;color:#1b7a34;font-weight:600}.tag.bad{background:#fde3e1;color:#c62828;font-weight:600}
.grow td{background:#dce8f6!important;color:#0d3c6b}
.btn.p{background:#1565c0;border-color:#1565c0}.btn.p:hover{background:#0d4f8b}
@media print{.card,.stat{box-shadow:none;border-top:0}}
#who{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.who-b{font-size:12px;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:12px;cursor:pointer;white-space:nowrap}
.who-b:hover{background:rgba(255,255,255,.28)}
.sync{font-size:12px;padding:4px 8px;white-space:nowrap}.sync.ok{color:#7ff0a0}.sync.dang{color:#ffd76a}.sync.loi{color:#ff9a9a;font-weight:600}
#login{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:linear-gradient(135deg,#0b5394 0%,#1e7bd6 55%,#2fa58a 100%)}
.lg-box{background:#fff;border-radius:12px;padding:28px 30px;width:360px;max-width:92vw;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.lg-box h2{margin:0;font-size:20px;color:var(--pri)}
.lg-logo{width:46px;height:46px;border-radius:50%;background:#eaf2fb;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:10px}
.lg-box label{display:block;font-size:13px;color:var(--mut);margin:10px 0 0}
.lg-box label input:not([type=checkbox]){display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:9px 10px;font:inherit;font-size:15px;border:1px solid var(--bd);border-radius:6px}
.lg-box .lg-ck{display:flex;gap:6px;align-items:center}
.lg-btn{width:100%;margin-top:14px;padding:10px;font-size:15px}
.lg-lnk{display:block;text-align:center;margin-top:10px;font-size:13px}
.lg-err{color:var(--bad);font-size:13px;margin-top:10px}
#lgMsg:not(.lg-err){font-size:13px;color:var(--mut);margin-top:10px}
.lg-help{margin-top:16px;padding-top:12px;border-top:1px solid var(--bd);font-size:12px;color:var(--mut);line-height:1.5}
</style>
</head>
<body>
<header>
 <div><h1 id="hTitle">Quản lý công việc Tổ Kỹ thuật điện &amp; IC</h1><div class="sub" id="hSub">Phòng Kỹ thuật - An toàn</div></div>
 <span class="sp"></span>
 <span id="who"></span><span class="bk" id="bk" onclick="go('settings')"></span>
</header>
<nav id="nav"></nav>
<main id="view"></main>
<div id="modal"></div>
<div id="tip"></div>
<input type="file" id="fileIn" accept=".json" style="display:none" onchange="importJSON(this)">

<script>
'use strict';
/* ================= TIỆN ÍCH ================= */
const KEY='QLCV_TO_DIEN_IC_V1';
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY=isoOf(new Date());
const THIS_YEAR=new Date().getFullYear();
const THIS_MONTH=TODAY.slice(0,7);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
const fd=s=>s?s.split('-').reverse().join('/'):'';
const fm=m=>m?m.split('-').reverse().join('/'):'';
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
const r2=n=>Math.round(n*100)/100;
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return isoOf(d)};
const dim=m=>new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
const mStart=m=>m+'-01', mEnd=m=>m+'-'+pad(dim(m));
const dow=iso=>new Date(iso+'T00:00:00').getDay();
const DOW=['CN','T2','T3','T4','T5','T6','T7'];
function overlap(a1,a2,b1,b2){const s=a1>b1?a1:b1,e=a2<b2?a2:b2;if(s>e)return 0;return Math.round((new Date(e)-new Date(s))/864e5)+1}
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function exportXls(name,title,headers,rows,foot){
 const cell=c=>typeof c==='number'?`<td>${c}</td>`:`<td style="mso-number-format:'\\@'">${esc(c).replace(/\n/g,'<br style="mso-data-placement:same-cell">')}</td>`;
 const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head><body>
<p><b>${esc(db.settings.dept.toUpperCase())}</b><br><b>${esc(db.settings.teamName.toUpperCase())}</b></p>
<h3 style="text-align:center">${esc(title)}</h3>
<table border="1" style="border-collapse:collapse"><tr>${headers.map(h=>`<th style="background:#dbe7f5">${esc(h)}</th>`).join('')}</tr>
${rows.map(r=>`<tr>${r.map(cell).join('')}</tr>`).join('')}</table>${foot?`<p>${esc(foot)}</p>`:''}
<p><i>Xuất ngày ${fd(TODAY)}</i></p></body></html>`;
 download(name+'.xls',new Blob(['\ufeff'+html],{type:'application/vnd.ms-excel'}));
}

/* ================= DỮ LIỆU ================= */
function defaultDB(){
 const names=[['Thành viên 1','Tổ trưởng'],['Thành viên 2','Tổ phó'],['Thành viên 3','Tổ phó'],['Thành viên 4','Chuyên viên'],['Thành viên 5','Chuyên viên'],['Thành viên 6','Chuyên viên']];
 return {version:1,
  members:names.map((x,i)=>({id:'m'+(i+1),name:x[0],role:x[1],active:true})),
  tasks:[],ot:[],schedule:[],emu:{},weekly:{},plans:[],seeded:{},ktkt:ktDef(),
  settings:{teamName:'Tổ Kỹ thuật điện & IC',dept:'Phòng Kỹ thuật - An toàn',
   otMonth:40,otYear:200,
   taskGroups:['Công tác trọng tâm','Công tác SCL, SXL','Công tác Thi nâng-giữ bậc','Công tác KHCN-Sáng kiến-Sáng tạo','Công tác Chuyên gia nội bộ','Công tác khác (Báo cáo, Tờ trình, ...)'],
   otCats:[{id:'SXD',name:'SXĐ',full:'Sản xuất điện'},{id:'SCL',name:'SCL',full:'Sửa chữa lớn'},{id:'SXK',name:'SXK',full:'Sản xuất khác'}],
   otTypes:[{id:'thuong',name:'Ngày thường',coef:1.5},{id:'nghi',name:'Ngày nghỉ hằng tuần',coef:2},{id:'le',name:'Ngày lễ, Tết',coef:3}],
   criteria:[{id:'c1',name:'Khối lượng công việc, hoàn thành nhiệm vụ',max:40},{id:'c2',name:'Chất lượng, tiến độ',max:20},{id:'c3',name:'Chấp hành kỷ luật, nội quy',max:15},{id:'c4',name:'An toàn lao động',max:15},{id:'c5',name:'Tinh thần phối hợp, sáng kiến',max:10}],
   grades:[{code:'A',name:'Hoàn thành xuất sắc nhiệm vụ',min:90},{code:'B',name:'Hoàn thành tốt nhiệm vụ',min:75},{code:'C',name:'Hoàn thành nhiệm vụ',min:50},{code:'D',name:'Không hoàn thành nhiệm vụ',min:0}]},
  lastBackup:null};
}
function load(){
 try{const s=localStorage.getItem(KEY);if(!s)return defaultDB();const d=JSON.parse(s);const def=defaultDB();
  for(const k of ['members','tasks','ot','schedule'])if(!Array.isArray(d[k]))d[k]=def[k];
  d.emu=d.emu||{};d.weekly=d.weekly||{};d.plans=d.plans||[];d.ktkt=d.ktkt||ktDef();if(!d.ktkt.scPlants){const k=ktDef();d.ktkt.scPlants=k.scPlants;d.ktkt.scCats=k.scCats}d.seeded=d.seeded||{};d.settings=Object.assign(def.settings,d.settings||{});return d;
 }catch(e){alert('Không đọc được dữ liệu đã lưu: '+e.message);return defaultDB()}
}
let db=load();
/* Không kèm dữ liệu nhập sẵn */
const SEED_W48={tasks:[],weekly:{}};
const SEED_OT={codes:{},recs:[]};
(function seedOT(){if(db.seeded.ot2026)return;for(const id in SEED_OT.codes){const m=db.members.find(x=>x.id===id);if(m&&!m.code)m.code=SEED_OT.codes[id]}
 const ids=new Set(db.ot.map(o=>o.id));SEED_OT.recs.forEach(r=>{if(!ids.has(r.id))db.ot.push({...r})});db.seeded.ot2026=TODAY;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}})();
function fixLead(){let ch=0;db.tasks.forEach(t=>{if(t.lead||!t.others)return;const parts=t.others.split(',').map(x=>x.normalize('NFC').replace(/[\s\u00a0\u200b]+/g,' ').trim());
 const m=db.members.find(m=>m.name.normalize('NFC').split(' ').pop()===parts[0]);if(m){t.lead=m.id;t.others=parts.slice(1).join(', ');ch++}});if(ch)try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
(function seedOnce(){if(db.seeded.w48_2026)return;const names=new Set(db.tasks.map(t=>t.year+'|'+t.name));
 SEED_W48.tasks.forEach(t=>{if(!names.has(t.year+'|'+t.name))db.tasks.push(JSON.parse(JSON.stringify(t)))});
 for(const k in SEED_W48.weekly)if(!db.weekly[k])db.weekly[k]=JSON.parse(JSON.stringify(SEED_W48.weekly[k]));
 db.seeded.w48_2026=TODAY;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}})();
fixLead();
const GRPS=()=>db.settings.taskGroups||[];
const grpIdx=g=>{const i=GRPS().indexOf(g||'');return i<0?(g?90:99):i};
const grpLabel=g=>{const i=GRPS().indexOf(g||'');return i<0?(g||'Chưa phân lĩnh vực'):(i+1)+'. '+g};
const grpOpts=cur=>[['','-- Chọn lĩnh vực --'],...GRPS().map((g,i)=>[g,(i+1)+'. '+g]),...(cur&&!GRPS().includes(cur)?[[cur,cur+' (cũ)']]:[])];
function guessGrp(t){const x=(t.name+' '+(t.content||'')).normalize('NFC').toLowerCase(),G=GRPS();

function weekMonday(wk){const[y,w]=wk.split('-W').map(Number);const j4=new Date(y,0,4);const d=(j4.getDay()+6)%7;return isoOf(new Date(y,0,4-d+(w-1)*7))}
function weekOf(iso){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7)+3);const y=d.getFullYear();return y+'-W'+pad(Math.floor(Math.round((d-new Date(y,0,1))/864e5)/7)+1)}
const wkNum=wk=>+wk.split('-W')[1];
ui.wk=weekOf(TODAY);ui.kw=ui.wk;
const shortName=id=>{const n=mName(id).trim().split(/\s+/);return n[n.length-1]};
const staffOf=t=>[t.lead,...(t.support||[])].filter(Boolean).map(shortName).concat(t.others?[t.others]:[]).join(', ');
const dlOf=t=>t.deadlineText||fd(t.deadline);
const prevWk=wk=>weekOf(addDays(weekMonday(wk),-7)),nextWk=wk=>weekOf(addDays(weekMonday(wk),7));
function weekCands(wk){const ws=weekMonday(wk),we=addDays(ws,6),its=(db.weekly[wk]||{}).items||{};
 return db.tasks.filter(t=>its[t.id]||(t.status!=='dung'&&(!t.start||t.start<=we)&&!(t.status==='xong'&&(!t.doneDate||t.doneDate<ws))&&(t.created||'')<=we&&(+t.year===+ws.slice(0,4)||+t.year===+we.slice(0,4))))}

function ktDef(){

const pn=s=>{const n=parseFloat(String(s??'').trim().replace(/\./g,'').replace(',','.'));return isNaN(n)?null:n};

function ktEval(dir,c){if(!c)return '';if(c.ev)return c.ev==='-'?'':c.ev;if(dir==='none')return '';const P=pnd(c.p),A=pnd(c.a);if(P==null||A==null)return '';return (dir==='le'?A<=P:A>=P)?'Đạt':'Không đạt'}
function ktData(wk){const W=db.ktkt.weeks;if(W[wk])return{d:W[wk],src:wk};const ks=Object.keys(W).filter(k=>k<wk).sort();if(ks.length){const k=ks[ks.length-1];return{d:W[k],src:k,inh:true}}return{d:{v:{},nx:{}},src:null,inh:true}}

 const d=W[wk],{g,pl,ind,k}=el.dataset;
 if(k==='nx'){d.nx=d.nx||{};d.nx[g]=el.value;save();return}
 if(k==='w'||k==='ly'||k==='ck'){d.sc=d.sc||{};const o=d.sc[pl]=d.sc[pl]||{w:'',ly:'',ck:''};o[k]=el.value.trim();
  if(k==='w'){const pv=ktData(prevWk(wk)).d,po=(pv.sc||{})[pl];const yr=weekMonday(wk).slice(0,4);if(po&&po.ly!==''&&wkNum(wk)>1&&prevWk(wk).startsWith(yr)&&pn(o.w)!=null)o.ly=String(pn(po.ly)+pn(o.w))}
  save();render();return}
 if(k==='dg'){d.dang=d.dang||{};d.dang[pl]=d.dang[pl]||{};d.dang[pl][el.dataset.cat]=el.value.trim();save();render();return}
 d.v[g]=d.v[g]||{};d.v[g][pl]=d.v[g][pl]||{};const c=d.v[g][pl][ind]=d.v[g][pl][ind]||{p:'',a:'',ev:''};c[k]=el.value.trim();save();render()}

/* ================= BIỂU ĐỒ (SVG tự vẽ, chạy offline) ================= */
const C_OK='#2e9d48',C_KO='#e04848';
const SER=['#257de0','#f47230','#00b894','#f2a600','#ee7fac','#008a17','#6a4ce2','#ec4647'],C_PREV='#b4b9c0',C_TX='#1f2933',C_MUT='#6b7785',C_GRID='#e6e9ee',ST_OK='#0a8f1f',ST_KO='#dc3c3d';
const fN=n=>n==null?'':String(r2(n)).replace('.',',');
const tipA=s=>esc(s).replace(/\n/g,'&#10;');
function hbarPath(x,y,w,h,r){r=Math.min(r,w,h/2);if(w<=0)return '';return `M${x},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h-r}Q${x+w},${y+h} ${x+w-r},${y+h}H${x}Z`}
const legendHtml=items=>`<div class="clg">${items.map(([c,l,shape])=>`<span>${shape==='tick'?`<i style="width:3px;height:12px;background:${c};border-radius:0"></i>`:`<i style="background:${c}"></i>`}${esc(l)}</span>`).join('')}</div>`;
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
// Thực hiện (thanh) so với Chỉ tiêu (vạch) cho một chỉ tiêu, nhiều nhà máy
function bulletChart(title,rows){
 const L=96,P=250,R=118,rh=34,top=8,W=L+P+R,H=top+rows.length*rh+22;
 const mx=niceMax(Math.max(...rows.map(r=>Math.max(r.p??0,r.a??0)))*1.08),sx=v=>L+P*(v/mx);
 const ticks=[0,mx/2,mx];
 let g=ticks.map(t=>`<line x1="${sx(t)}" x2="${sx(t)}" y1="${top}" y2="${H-20}" stroke="${C_GRID}"/><text x="${sx(t)}" y="${H-6}" font-size="11" fill="${C_MUT}" text-anchor="middle">${fN(t)}</text>`).join('');
 rows.forEach((r,i)=>{const y=top+i*rh,cy=y+rh/2;const ok=r.ev==='Đạt',ko=r.ev==='Không đạt';
  g+=`<g data-tip="${tipA(`${r.plant}\nThực hiện: ${r.as||'—'}\nChỉ tiêu: ${r.ps||'—'}${r.ev?'\nĐánh giá: '+r.ev:''}`)}"><rect x="0" y="${y}" width="${W}" height="${rh}" fill="transparent"/>
  <text x="${L-8}" y="${cy+4}" font-size="12" fill="${C_TX}" text-anchor="end">${esc(r.plant)}</text>
  ${r.a!=null?`<path d="${hbarPath(L,cy-7,sx(r.a)-L,14,4)}" fill="${ok?C_OK:ko?C_KO:SER[0]}"/>`:''}
  ${r.p!=null?`<line x1="${sx(r.p)}" x2="${sx(r.p)}" y1="${cy-12}" y2="${cy+12}" stroke="${C_TX}" stroke-width="2.5"/>`:''}
  <text x="${L+P+8}" y="${cy-1}" font-size="12" fill="${C_TX}" font-weight="600">${esc(r.as||'—')}<tspan fill="${C_MUT}" font-weight="400"> / ${esc(r.ps||'—')}</tspan></text>
  ${r.ev?`<text x="${L+P+8}" y="${cy+13}" font-size="11" font-weight="600" fill="${ok?ST_OK:ST_KO}">${ok?'✓ Đạt':'✗ Không đạt'}</text>`:''}</g>`});
 return `<div class="chart"><div class="ct">${esc(title)}</div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(title)}">${g}</svg>${legendHtml([...(rows.some(r=>r.ev==='Đạt')?[[C_OK,'Thực hiện - Đạt']]:[]),...(rows.some(r=>r.ev==='Không đạt')?[[C_KO,'Thực hiện - Không đạt']]:[]),...(rows.some(r=>!r.ev)?[[SER[0],'Thực hiện']]:[]),[C_TX,'Chỉ tiêu','tick']])}</div>`;
}
// Lũy kế năm so với cùng kỳ năm trước
function incCompareChart(d,y){
 const K=db.ktkt,rows=K.scPlants.map(pl=>{const o=(d.sc||{})[pl]||{};return{pl,ly:pn(o.ly),ck:pn(o.ck),w:o.w}});
 const L=96,P=270,R=40,rh=34,top=8,W=L+P+R,H=top+rows.length*rh+22,mx=niceMax(Math.max(1,...rows.map(r=>Math.max(r.ly||0,r.ck||0)))),sx=v=>L+P*(v/mx);
 const ticks=[0,mx/2,mx];
 let g=ticks.map(t=>`<line x1="${sx(t)}" x2="${sx(t)}" y1="${top}" y2="${H-20}" stroke="${C_GRID}"/><text x="${sx(t)}" y="${H-6}" font-size="11" fill="${C_MUT}" text-anchor="middle">${fN(t)}</text>`).join('');
 rows.forEach((r,i)=>{const y=top+i*rh,cy=y+rh/2;const diff=r.ly!=null&&r.ck!=null?r.ly-r.ck:null;
  g+=`<g data-tip="${tipA(`${r.pl}\nLũy kế năm ${y}: ${r.ly??'—'}\nCùng kỳ năm ${y-1}: ${r.ck??'—'}${diff!=null?'\n'+(diff>0?'Tăng '+diff:diff<0?'Giảm '+(-diff):'Bằng cùng kỳ'):''}`)}"><rect x="0" y="${y}" width="${W}" height="${rh}" fill="transparent"/>
  <text x="${L-8}" y="${cy+4}" font-size="12" fill="${C_TX}" text-anchor="end">${esc(r.pl)}</text>
  ${r.ly?`<path d="${hbarPath(L,cy-11,sx(r.ly)-L,10,3)}" fill="${diff!=null&&diff>0?C_KO:diff!=null?C_OK:SER[0]}"/>`:''}<text x="${sx(r.ly||0)+5}" y="${cy-2}" font-size="11" fill="${C_TX}" font-weight="600">${r.ly??''}</text>
  ${r.ck?`<path d="${hbarPath(L,cy+1,sx(r.ck)-L,10,3)}" fill="${C_PREV}"/>`:''}<text x="${sx(r.ck||0)+5}" y="${cy+10}" font-size="11" fill="${C_MUT}">${r.ck??''}</text></g>`});
 return `<div class="chart"><div class="ct">Sự cố lũy kế năm ${y} so với cùng kỳ năm ${y-1}</div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}</svg>${legendHtml([[C_KO,'Lũy kế năm '+y+' - tăng so cùng kỳ'],[C_OK,'Lũy kế năm '+y+' - giảm/bằng'],[C_PREV,'Cùng kỳ năm '+(y-1)]])}</div>`;
}
// Cơ cấu các dạng sự cố (thanh chồng)
function incTypeChart(d){
 const K=db.ktkt,cats=K.scCats.slice(0,8),rows=K.scPlants.map(pl=>{const o=(d.dang||{})[pl]||{};const v=cats.map(c=>pn(o[c])||0);return{pl,v,t:v.reduce((a,b)=>a+b,0)}});
 const L=96,P=270,R=40,rh=30,top=8,W=L+P+R,H=top+rows.length*rh+22,mx=niceMax(Math.max(1,...rows.map(r=>r.t))),sx=v=>P*(v/mx);
 let g=[0,mx/2,mx].map(t=>`<line x1="${L+sx(t)}" x2="${L+sx(t)}" y1="${top}" y2="${H-20}" stroke="${C_GRID}"/><text x="${L+sx(t)}" y="${H-6}" font-size="11" fill="${C_MUT}" text-anchor="middle">${fN(t)}</text>`).join('');
 rows.forEach((r,i)=>{const y=top+i*rh,cy=y+rh/2;let x=L;
  g+=`<text x="${L-8}" y="${cy+4}" font-size="12" fill="${C_TX}" text-anchor="end">${esc(r.pl)}</text>`;
  const segs=r.v.map((v,j)=>({v,j})).filter(s=>s.v>0);
  segs.forEach((s,k)=>{const w=sx(s.v),last=k===segs.length-1;
   g+=`<g data-tip="${tipA(`${r.pl}\n${cats[s.j]}: ${s.v}\nTổng: ${r.t}`)}">${last?`<path d="${hbarPath(x,cy-8,Math.max(w-2,1),16,4)}" fill="${SER[s.j]}"/>`:`<rect x="${x}" y="${cy-8}" width="${Math.max(w-2,1)}" height="16" fill="${SER[s.j]}"/>`}
   ${w>=18?`<text x="${x+(w-2)/2}" y="${cy+4}" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">${s.v}</text>`:''}</g>`;x+=w});
  g+=`<text x="${x+4}" y="${cy+4}" font-size="11" fill="${C_TX}" font-weight="600">${r.t}</text>`});
 return `<div class="chart"><div class="ct">Cơ cấu các dạng sự cố (lũy kế năm)</div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}</svg>${legendHtml(cats.map((c,j)=>[SER[j],c]))}</div>`;
}
// Diễn biến sự cố lũy kế theo tuần
function incTrendChart(wk){
 const K=db.ktkt,y=weekMonday(wk).slice(0,4),keys=Object.keys(K.weeks).filter(k=>k<=wk&&k.startsWith(y)&&K.weeks[k].sc).sort().slice(-12);
 if(keys.length<2)return `<div class="chart"><div class="ct">Diễn biến sự cố lũy kế theo tuần</div><div class="empty" style="padding:40px 10px">Biểu đồ sẽ hiện khi có số liệu từ 2 tuần trở lên.<br>Hiện có: ${keys.map(k=>'tuần '+wkNum(k)).join(', ')||'chưa có'}.</div></div>`;
 const pls=K.scPlants.slice(0,8),L=36,P=330,R=14,top=12,PH=170,W=L+P+R,H=top+PH+26;
 const val=(k,pl)=>pn(((K.weeks[k].sc||{})[pl]||{}).ly);
 const mx=niceMax(Math.max(1,...keys.flatMap(k=>pls.map(pl=>val(k,pl)||0))));
 const sx=i=>L+(keys.length===1?P/2:P*i/(keys.length-1)),sy=v=>top+PH-PH*v/mx;
 let g=[0,.25,.5,.75,1].map(f=>`<line x1="${L}" x2="${L+P}" y1="${sy(mx*f)}" y2="${sy(mx*f)}" stroke="${C_GRID}"/><text x="${L-6}" y="${sy(mx*f)+4}" font-size="11" fill="${C_MUT}" text-anchor="end">${fN(mx*f)}</text>`).join('');
 g+=keys.map((k,i)=>`<text x="${sx(i)}" y="${H-6}" font-size="11" fill="${C_MUT}" text-anchor="middle">T${wkNum(k)}</text>`).join('');
 pls.forEach((pl,j)=>{const pts=keys.map((k,i)=>[sx(i),val(k,pl)]).filter(p=>p[1]!=null);
  if(pts.length>1)g+=`<polyline points="${pts.map(p=>p[0]+','+sy(p[1])).join(' ')}" fill="none" stroke="${SER[j]}" stroke-width="2" stroke-linejoin="round"/>`});
 pls.forEach((pl,j)=>keys.forEach((k,i)=>{const v=val(k,pl);if(v==null)return;
  g+=`<circle cx="${sx(i)}" cy="${sy(v)}" r="4" fill="${SER[j]}" stroke="#fff" stroke-width="2"/>`}));
 keys.forEach((k,i)=>{g+=`<rect x="${sx(i)-Math.max(10,P/(keys.length-1)/2)}" y="${top}" width="${Math.max(20,P/(keys.length-1))}" height="${PH}" fill="transparent" data-tip="${tipA('Tuần '+wkNum(k)+' - lũy kế năm\n'+pls.map(pl=>pl+': '+(val(k,pl)??'—')).join('\n'))}"/>`});
 return `<div class="chart"><div class="ct">Diễn biến sự cố lũy kế theo tuần (năm ${y})</div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}</svg>${legendHtml(pls.map((p,j)=>[SER[j],p]))}</div>`;
}
function vCharts(x,wk){
 const d=x.d,byInd={};
 db.ktkt.groups.forEach(g=>g.inds.forEach(ind=>g.plants.forEach(pl=>{const c=ktCell(d,g,pl,ind);if(!c)return;(byInd[ind.name]=byInd[ind.name]||[]).push({plant:pl,p:pnd(c.p),a:pnd(c.a),ps:c.p,as:c.a,ev:ktEval(ind.dir,c)})})));
 const y=+weekMonday(wk).slice(0,4);
 return `<details class="noprint" open style="margin:6px 0 10px"><summary style="cursor:pointer;color:var(--pri);font-weight:600">Biểu đồ đánh giá tuần ${wkNum(wk)}</summary><div class="charts">
  ${Object.entries(byInd).map(([n,rows])=>bulletChart(n+' - thực hiện so với chỉ tiêu',rows)).join('')}
  ${incCompareChart(d,y)}${incTypeChart(d)}${incTrendChart(wk)}</div></details>`;
}
document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');const tp=document.getElementById('tip');if(!tp)return;if(!t){tp.style.display='none';return}tp.textContent=t.getAttribute('data-tip');tp.style.display='block'});
document.addEventListener('mousemove',e=>{const tp=document.getElementById('tip');if(tp&&tp.style.display==='block'){tp.style.left=Math.min(e.clientX+14,innerWidth-tp.offsetWidth-8)+'px';tp.style.top=(e.clientY+14)+'px'}});

function goTasks(y,st){ui.tYear=String(y);ui.tSt=st;ui.tMem='';ui.tQ='';go('tasks')}

 openModal(`Tiến độ các công tác trọng tâm năm ${y} (bình quân ${avg}%)`,ts.length?`<table><tr><th class="c">TT</th><th>Công tác</th><th>Chủ trì</th><th>Thời hạn</th><th style="width:120px">Tiến độ</th><th>Trạng thái</th></tr>${ts.map((t,i)=>`<tr><td class="c">${i+1}</td><td><a href="#" onclick="closeModal();viewTask('${t.id}');return false">${esc(t.name)}</a></td><td>${esc(mName(t.lead))}</td><td>${esc(dlOf(t))}</td><td>${pBar(t)}</td><td>${stTag(t)}</td></tr>`).join('')}</table><p class="mut">Sắp xếp từ tiến độ thấp đến cao. Bấm tên công tác để xem chi tiết.</p>`:'<div class="empty">Chưa có công tác.</div>',null,{wide:true,extra:`<button class="btn" onclick="closeModal();goTasks('${y}','')">Mở mục Công tác trọng tâm</button>`})}
function showToday(){const es=db.schedule.filter(s=>s.from<=TODAY&&s.to>=TODAY);
 openModal(`Lịch hôm nay ${DOW[dow(TODAY)]}, ${fd(TODAY)}`,es.length?`<table><tr><th>Thành viên</th><th>Loại</th><th>Thời gian</th><th>Địa điểm</th><th>Nội dung</th><th>Hồ sơ</th><th></th></tr>${es.map(s=>`<tr><td>${esc(s.members.map(mName).join(', '))}</td><td><span class="tag" style="background:${schT(s.type)[2]};color:#fff">${schT(s.type)[1]}</span></td><td style="white-space:nowrap">${fd(s.from)}${s.to!==s.from?' → '+fd(s.to):''}</td><td>${esc(s.location)}</td><td>${nl(s.content)}</td><td>${attIcons(s)}</td><td><button class="btn s" onclick="closeModal();editSch('${s.id}')">Sửa</button></td></tr>`).join('')}</table>`:'<div class="empty">Hôm nay không có ai có lịch công tác, họp, nghỉ... Tất cả làm việc tại đơn vị.</div>',null,{wide:true,extra:`<button class="btn" onclick="closeModal();ui.sMonth=THIS_MONTH;go('sch')">Mở lịch tháng này</button>`})}
function vDash(){
 const y=String(THIS_YEAR),ts=db.tasks.filter(t=>String(t.year)===y),c=k=>ts.filter(t=>tState(t)===k).length;
 const avg=ts.length?Math.round(ts.reduce((a,t)=>a+num(t.progress),0)/ts.length):0;

function grpSet(i,v){v=v.trim();if(!v)return render();const G=db.settings.taskGroups,old=G[i];G[i]=v;[...db.tasks,...db.plans].forEach(x=>{if(x.group===old)x.group=v});save();render()}
function grpMove(i,k){const G=db.settings.taskGroups,j=i+k;if(j<0||j>=G.length)return;[G[i],G[j]]=[G[j],G[i]];save();render()}
function grpDel(i){const G=db.settings.taskGroups,g=G[i],n=[...db.tasks,...db.plans].filter(x=>x.group===g).length;if(!confirm(`Xóa lĩnh vực "${g}"?`+(n?`\n${n} công tác/kế hoạch đang dùng sẽ chuyển thành "Chưa phân lĩnh vực".`:'')))return;G.splice(i,1);[...db.tasks,...db.plans].forEach(x=>{if(x.group===g)x.group=''});save();render()}

 localStorage.setItem(KEY,JSON.stringify(d));db=load();save();render();alert('Đã khôi phục dữ liệu'+(nf?` và ${nf} file đính kèm`:'')+'.')}catch(e){alert('Lỗi: '+e.message)}finally{inp.value=''}};r.readAsText(f,'utf-8')}

async function loadFB(cfg){
 const base='https://www.gstatic.com/firebasejs/'+FBV+'/';
 const [A,U,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
 const app=A.initializeApp(cfg),auth=U.getAuth(app),fs=F.getFirestore(app);
 const commitAll=async ops=>{for(let i=0;i<ops.length;i+=150){const b=F.writeBatch(fs);ops.slice(i,i+150).forEach(o=>o.del?b.delete(F.doc(fs,o.c,o.id)):b.set(F.doc(fs,o.c,o.id),o.d));await b.commit()}};
 return {
  onAuth:cb=>U.onAuthStateChanged(auth,u=>cb(u?{email:(u.email||'').toLowerCase()}:null)),
  signIn:async(e,p,rem)=>{await U.setPersistence(auth,rem?U.browserLocalPersistence:U.browserSessionPersistence);return U.signInWithEmailAndPassword(auth,e,p)},
  signUp:async(e,p,rem)=>{await U.setPersistence(auth,rem?U.browserLocalPersistence:U.browserSessionPersistence);return U.createUserWithEmailAndPassword(auth,e,p)},
  signOut:()=>U.signOut(auth),
  createUser:async(e,p)=>{const a2=A.initializeApp(cfg,'aux'+Date.now()),u2=U.getAuth(a2);try{await U.setPersistence(u2,U.inMemoryPersistence);await U.createUserWithEmailAndPassword(u2,e,p);await U.signOut(u2)}finally{A.deleteApp(a2).catch(()=>{})}},
  changePw:async(old,nw)=>{const u=auth.currentUser;await U.reauthenticateWithCredential(u,U.EmailAuthProvider.credential(u.email,old));await U.updatePassword(u,nw)},
  listen:(cb,err)=>F.onSnapshot(F.collection(fs,'qlcv'),snap=>cb(snap.docChanges().map(c=>({id:c.doc.id,type:c.type,data:c.doc.data()}))),err),
  commit:commitAll,
  setAcl:d=>F.setDoc(F.doc(fs,'acl','team'),d),
  getFile:async id=>{const m=await F.getDoc(F.doc(fs,'qlcv_files',id+'~m'));if(!m.exists())return null;const {n,type}=m.data();let s='';
   for(let i=0;i<n;i++){const c=await F.getDoc(F.doc(fs,'qlcv_files',id+'~'+i));s+=c.data().d}return {dataUrl:s,type}},
  putFile:async(id,dataUrl,type)=>{const CH=800000,n=Math.ceil(dataUrl.length/CH),ops=[];for(let i=0;i<n;i++)ops.push({c:'qlcv_files',id:id+'~'+i,d:{d:dataUrl.slice(i*CH,(i+1)*CH)}});
   for(const o of ops)await commitAll([o]);await commitAll([{c:'qlcv_files',id:id+'~m',d:{n,type,at:Date.now()}}])},
  delFile:async id=>{const m=await F.getDoc(F.doc(fs,'qlcv_files',id+'~m'));const n=m.exists()?m.data().n:0;const ops=[{c:'qlcv_files',id:id+'~m',del:1}];for(let i=0;i<n;i++)ops.push({c:'qlcv_files',id:id+'~'+i,del:1});await commitAll(ops)}
 }}

const U_ARR=['tasks','ot','schedule','plans'],U_MAP=['emu','weekly'],ADM_DOCS=['members','settings'];
function toUnits(d){const u={members:JSON.stringify(d.members),settings:JSON.stringify(d.settings),seeded:JSON.stringify(d.seeded||{})};
 const {weeks,...kc}=d.ktkt||{};u.ktcfg=JSON.stringify(kc);for(const w in weeks||{})u['ktw~'+w]=JSON.stringify(weeks[w]);
 U_ARR.forEach(k=>(d[k]||[]).forEach(x=>{u[k+'~'+x.id]=JSON.stringify(x)}));
 U_MAP.forEach(k=>{for(const key in d[k]||{})u[k+'~'+key]=JSON.stringify(d[k][key])});return u}
function fromUnits(u,ord){const d={tasks:[],ot:[],schedule:[],plans:[],emu:{},weekly:{},ktkt:{weeks:{}}};
 const ids=Object.keys(u).sort((a,b)=>(ord[a]||0)-(ord[b]||0));
 for(const id of ids){let v;try{v=JSON.parse(u[id])}catch(e){continue}const i=id.indexOf('~');
  if(i<0){if(id==='ktcfg')Object.assign(d.ktkt,v);else d[id]=v;continue}
  const k=id.slice(0,i),key=id.slice(i+1);if(k==='ktw')d.ktkt.weeks[key]=v;else if(U_ARR.includes(k))d[k].push(v);else if(U_MAP.includes(k))d[k][key]=v}
 return d}
function normDB(d){const def=defaultDB();for(const k of ['members','tasks','ot','schedule'])if(!Array.isArray(d[k]))d[k]=def[k];
 d.emu=d.emu||{};d.weekly=d.weekly||{};d.plans=d.plans||[];if(!d.ktkt||!d.ktkt.groups){const k=ktDef();d.ktkt=Object.assign(k,d.ktkt||{});d.ktkt.weeks=d.ktkt.weeks||{}}
 if(!d.ktkt.scPlants){const k=ktDef();d.ktkt.scPlants=k.scPlants;d.ktkt.scCats=k.scCats}d.seeded=d.seeded||{};d.settings=Object.assign(def.settings,d.settings||{});return d}
function applyCloud(){const lb=db.lastBackup;db=normDB(fromUnits(CL,CLO));db.lastBackup=localStorage.getItem(KEY+'_LB_ONLINE')||lb;migrateMembers();
 const m=db.members.find(x=>mailOf(x.user)===CUR.email);
 if(!m){LG_KEEP='Tài khoản '+CUR.email.replace(MAIL_DOM,'')+' chưa được gán cho thành viên nào trong tổ. Báo Tổ trưởng kiểm tra.';showLogin(LG_KEEP);FB.signOut();return false}
 CUR.mid=m.id;CUR.perm=m.active?(m.perm||'cv'):'xem';CUR.name=m.name;CUR.user=m.user;
 if(window.__selfSign&&!accSt(m.user)){window.__selfSign=null;setAccSt(m.user,'ok');setTimeout(()=>save(),50)}return true}

function cloudSave(){if(!FB||!FB_READY||CUR.offline)return;
 const U=toUnits(db),ops=[];const by=CUR.user||'';
 for(const id in U){if(U[id]===CL[id])continue;if(!isAdmin()&&ADM_DOCS.includes(id))continue;if(!CLO[id])CLO[id]=Date.now()+ops.length;
  ops.push({c:'qlcv',id,d:{v:U[id],o:CLO[id],by,at:Date.now()}});CL[id]=U[id]}
 for(const id in CL)if(!(id in U)){if(!isAdmin()&&ADM_DOCS.includes(id))continue;ops.push({c:'qlcv',id,del:1});delete CL[id]}
 if(!ops.length)return;setSync('dang');
 FB.commit(ops).then(()=>setSync('ok')).catch(e=>{setSync('loi',e.message);alert('Không lưu được lên dữ liệu chung: '+fbErr(e)+'\nDữ liệu sẽ được tải lại từ máy chủ.');resync()});

function pushAcl(){if(!FB||!isAdmin())return Promise.resolve();const ms=db.members.filter(m=>m.user);
 return FB.setAcl({emails:ms.filter(m=>m.active).map(m=>mailOf(m.user)),admins:ms.filter(m=>m.active&&m.perm==='admin').map(m=>mailOf(m.user)),at:Date.now()}).catch(e=>console.warn('acl',e))}
let UNSUB=null;
function resync(){if(UNSUB)UNSUB();CL={};CLO={};FB_READY=false;startListen()}
function startListen(){let first=true;setSync('dang');
 UNSUB=FB.listen(ch=>{ch.forEach(c=>{if(c.type==='removed'){delete CL[c.id];delete CLO[c.id]}else{CL[c.id]=c.data.v;CLO[c.id]=c.data.o||0}});
  if(first){first=false;FB_READY=true;setSync('ok');
   if(!Object.keys(CL).length)return cloudEmpty();

 e=>{setSync('loi',e.message);if(first)showLogin(e.code==='permission-denied'?'Tài khoản này chưa có quyền truy cập dữ liệu chung (chưa có trong danh sách tổ). Báo Tổ trưởng.':'Lỗi kết nối dữ liệu: '+fbErr(e),true)})}

 'auth/email-already-in-use':'Tài khoản này đã được tạo rồi, hãy đăng nhập. Nếu quên mật khẩu, báo Tổ trưởng xóa tài khoản trên Firebase rồi tạo lại.',
 'auth/weak-password':'Mật khẩu tối thiểu 6 ký tự.','auth/too-many-requests':'Nhập sai quá nhiều lần, thử lại sau ít phút.','auth/network-request-failed':'Không có kết nối mạng.',
 'auth/operation-not-allowed':'Firebase chưa bật đăng nhập Email/Password.','auth/invalid-email':'Tên tài khoản không hợp lệ.','auth/requires-recent-login':'Cần đăng nhập lại.',
 'permission-denied':'Không có quyền (kiểm tra Rules và danh sách tổ).','unavailable':'Mất kết nối máy chủ.'})[c]||((e&&e.message)||String(e))}

const accSt=u=>((db.seeded.acc||{})[String(u||'').toLowerCase()]||'');

function tmpPw(){const c='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';const r=new Uint32Array(8);crypto.getRandomValues(r);return [...r].map(x=>c[x%c.length]).join('')}
async function createAccounts(ids){if(!isAdmin()||!FB||CUR.offline)return;
 const list=db.members.filter(m=>ids.includes(m.id)&&m.user&&m.id!==CUR.mid);if(!list.length)return alert('Không có tài khoản nào cần tạo.');
 if(!confirm('Tạo tài khoản đăng nhập với mật khẩu tạm cho:\n'+list.map(m=>m.user+' - '+m.name).join('\n')+'\n\nMỗi người sẽ phải đổi mật khẩu ở lần đăng nhập đầu tiên.'))return;
 const out=[];setSync('dang');
 for(const m of list){const pw=tmpPw();try{await FB.createUser(mailOf(m.user),pw);setAccSt(m.user,'tmp');out.push([m,pw,''])}
  catch(e){if(e.code==='auth/email-already-in-use'){if(!accSt(m.user))setAccSt(m.user,'ok');out.push([m,'','Đã có tài khoản từ trước (giữ nguyên mật khẩu cũ)'])}else out.push([m,'','Lỗi: '+fbErr(e)])}}
 save();setSync('ok');render();
 const txt=out.filter(x=>x[1]).map(([m,pw])=>`${m.name}: tài khoản ${m.user} / mật khẩu tạm ${pw}`).join('\n');
 openModal('Tài khoản đã tạo',`<p>Gửi riêng cho từng người. Mật khẩu tạm chỉ hiện <b>một lần</b> ở đây, hãy sao chép lại trước khi đóng.</p>
  <table><tr><th>Thành viên</th><th>Tài khoản</th><th>Mật khẩu tạm</th></tr>${out.map(([m,pw,note])=>`<tr><td>${esc(m.name)}</td><td><b>${esc(m.user)}</b></td><td>${pw?`<code style="font-size:15px">${esc(pw)}</code>`:`<span class="mut">${esc(note)}</span>`}</td></tr>`).join('')}</table>
  <p class="mut">Link: ${esc(location.protocol.startsWith('http')?location.href.split('#')[0]:'https://ngocnam-eps.github.io/qlcv-to-dien/')}</p><textarea id="accTxt" style="position:absolute;left:-9999px">${esc(txt)}</textarea>`,null,
  {extra:txt?`<button class="btn p" onclick="const t=document.getElementById('accTxt');t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.resolve(document.execCommand('copy'))).then(()=>alert('Đã sao chép danh sách'))">Sao chép danh sách</button>`:''})}

function mustChangeCheck(){if(CUR.offline||!CUR.user||!FB_READY||MC_OPEN||accSt(CUR.user)!=='tmp')return;MC_OPEN=true;
 openModal('Đặt mật khẩu mới',`<p>Bạn đang dùng mật khẩu tạm do Tổ trưởng cấp. Hãy đặt mật khẩu riêng của mình.</p><div class="frm">${LG_PW?'':'<label class="full">Mật khẩu tạm<input type="password" id="mc0"></label>'}<label class="full">Mật khẩu mới (tối thiểu 6 ký tự)<input type="password" id="mc1"></label><label class="full">Nhập lại mật khẩu mới<input type="password" id="mc2"></label></div>`,()=>{
  const old=LG_PW||document.getElementById('mc0').value,a=document.getElementById('mc1').value;if(a.length<6){alert('Mật khẩu tối thiểu 6 ký tự');return false}if(a!==document.getElementById('mc2').value){alert('Hai lần nhập không khớp');return false}if(a===old){alert('Mật khẩu mới phải khác mật khẩu tạm');return false}
  FB.changePw(old,a).then(()=>{LG_PW='';setAccSt(CUR.user,'ok');save();MC_OPEN=false;alert('Đã đổi mật khẩu. Lần sau đăng nhập bằng mật khẩu mới.')}).catch(e=>{MC_OPEN=false;alert('Không đổi được: '+fbErr(e));mustChangeCheck()})},{saveText:'Lưu mật khẩu'});
 const x=document.querySelector('#modal .x');if(x)x.style.display='none';document.querySelectorAll('#modal .mfoot .btn:not(.p)').forEach(b=>b.style.display='none')}
/* ---- Cài đặt: tài khoản, phân quyền, kết nối ---- */
function acSet(id,k,v){if(!isAdmin())return deny('phân quyền');const m=mById(id);if(k==='user'){v=v.trim();if(!/^[A-Za-z][A-Za-z0-9]{1,30}$/.test(v)){alert('Tên tài khoản không dấu, không khoảng trắng');return render()}
 if(db.members.some(x=>x!==m&&(x.user||'').toLowerCase()===v.toLowerCase())){alert('Tên tài khoản đã có người dùng');return render()}}
 if(k==='perm'&&m.id===CUR.mid&&v!=='admin'&&!confirm('Bạn đang tự bỏ quyền Quản trị của chính mình. Tiếp tục?'))return render();
 m[k]=v;save();render()}
function fbConnect(){const o=parseCfg(document.getElementById('fbCfgTxt').value);if(!o)return alert('Không đọc được cấu hình. Hãy dán nguyên đoạn const firebaseConfig = {...} lấy từ Firebase.');
 localStorage.setItem(FB_CFG_KEY,JSON.stringify(o));alert('Đã lưu cấu hình. Trang sẽ tải lại để đăng nhập.');location.reload()}
function fbOffline(){if(!confirm('Ngắt kết nối dữ liệu chung trên trình duyệt này?\nỨng dụng sẽ quay về dùng dữ liệu riêng trên máy (không đồng bộ với tổ).'))return;
 localStorage.setItem(FB_CFG_KEY,JSON.stringify({off:1}));if(FB)FB.signOut().finally(()=>location.reload());else location.reload()}
function fbOnline(){localStorage.removeItem(FB_CFG_KEY);location.reload()}
function rulesText(){const own=db.members.filter(m=>m.perm==='admin'&&m.user).map(m=>`'${mailOf(m.user)}'`);
 return `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signed() { return request.auth != null && request.auth.token.email != null; }
    function owner() { return signed() && request.auth.token.email in [${own.join(', ')}]; }
    function acl() { return get(/databases/$(database)/documents/acl/team).data; }
    function hasAcl() { return exists(/databases/$(database)/documents/acl/team); }
    function team() { return owner() || (signed() && hasAcl() && request.auth.token.email in acl().emails); }
    function admin() { return owner() || (signed() && hasAcl() && request.auth.token.email in acl().admins); }
    match /acl/{d} { allow read: if team(); allow write: if admin(); }
    match /qlcv/{k} { allow read: if team(); allow write: if team() && (!(k in ['members', 'settings']) || admin()); }
    match /qlcv_files/{k} { allow read, write: if team(); }
  }
}`}
function copyRules(){const t=document.getElementById('rulesTxt');t.select();navigator.clipboard?navigator.clipboard.writeText(t.value).then(()=>alert('Đã sao chép Rules')):document.execCommand('copy')}
function vAccount(){const me=ME();const cfg=fbCfg();
 const accRows=db.members.map((m,i)=>`<tr${m.active?'':' class="mut"'}><td class="c">${i+1}</td><td>${esc(m.name)}<div class="mut">${esc(m.role)}</div></td>
  <td>${isAdmin()?`<input value="${esc(m.user||'')}" style="width:110px" onchange="acSet('${m.id}','user',this.value)">`:`<b>${esc(m.user||'')}</b>`}</td>
  <td>${CUR.offline?'':m.id===CUR.mid?'<span class="tag ok">Đang dùng</span>':accSt(m.user)==='ok'?'<span class="tag ok">Đã kích hoạt</span>':accSt(m.user)==='tmp'?'<span class="tag w">Chờ đổi MK tạm</span>':isAdmin()&&m.active?`<button class="btn s" onclick="createAccounts(['${m.id}'])">Tạo TK</button>`:'<span class="mut">Chưa tạo</span>'}</td><td>${isAdmin()?`<select onchange="acSet('${m.id}','perm',this.value)">${Object.entries(PERMS).map(([k,l])=>`<option value="${k}"${m.perm===k?' selected':''}>${l}</option>`).join('')}</select>`:esc(PERMS[m.perm]||'')}</td></tr>`).join('');
 const conn=CUR.offline?`<p>Ứng dụng đang dùng <b>dữ liệu riêng trên trình duyệt này</b>, chưa đăng nhập, không đồng bộ với tổ.</p>
   ${FB_EMBED&&!fbCfg()?`<p><button class="btn p" onclick="fbOnline()">Bật lại dữ liệu chung của tổ</button></p>`:''}
   <p>Để cả tổ đăng nhập và dùng chung một bộ dữ liệu, dán cấu hình Firebase (<code>const firebaseConfig = {...}</code>) vào ô dưới:</p>
   <textarea id="fbCfgTxt" rows="6" style="width:100%;font-family:monospace;font-size:12px" placeholder="const firebaseConfig = {&#10;  apiKey: &quot;...&quot;,&#10;  authDomain: &quot;...&quot;,&#10;  projectId: &quot;...&quot;, ...&#10;};"></textarea>
   <p><button class="btn p" onclick="fbConnect()">Kết nối dữ liệu chung</button></p>`
  :`<p>Đang dùng <b>dữ liệu chung</b> (Firebase: <code>${esc((cfg||{}).projectId||'')}</code>). Mọi thay đổi được lưu lên mạng và hiện ngay trên máy các thành viên khác.</p>
   ${isAdmin()?`<p><button class="btn" onclick="if(confirm('Ghi toàn bộ dữ liệu đang hiển thị (kèm file đính kèm có trên máy này) lên dữ liệu chung?'))pushAll()">⇪ Đưa lại toàn bộ dữ liệu + file lên mạng</button> <button class="btn" onclick="fbOffline()">Ngắt kết nối trên trình duyệt này</button></p>`:''}`;
 return `<div class="grid2" style="margin-bottom:14px"><div class="card"><h3>Tài khoản của tôi</h3>
  ${CUR.offline?'<p class="mut">Chế độ trên máy: không cần đăng nhập, có toàn quyền.</p>':`<table><tr><th>Họ tên</th><td>${esc(me?me.name:'')}</td></tr><tr><th>Tài khoản</th><td><b>${esc(CUR.user||'')}</b></td></tr><tr><th>Quyền</th><td>${esc(PERMS[CUR.perm]||'')}</td></tr></table>
  <p><button class="btn" onclick="changePw()">Đổi mật khẩu</button> <button class="btn" onclick="logout()">Đăng xuất</button> <button class="btn" onclick="backupJSON()">Tải bản sao lưu (JSON)</button></p>`}
  <h3 style="margin-top:14px">Kết nối dữ liệu chung</h3>${conn}</div>
  <div class="card"><h3>Tài khoản đăng nhập & phân quyền</h3><table><tr><th class="c">TT</th><th>Thành viên</th><th>Tài khoản</th><th>Trạng thái</th><th>Quyền</th></tr>${accRows}</table>${isAdmin()&&!CUR.offline?`<p><button class="btn p" onclick="createAccounts(db.members.filter(m=>m.active&&m.id!==CUR.mid&&!accSt(m.user)).map(m=>m.id))">＋ Tạo tài khoản cho cả tổ (mật khẩu tạm)</button></p>`:''}
  <div class="mut" style="margin-top:8px;line-height:1.6"><b>Quản trị:</b> toàn quyền, cài đặt, thành viên, khóa thi đua.<br><b>Quản lý - duyệt:</b> sửa mọi công tác, duyệt thêm giờ, chấm thi đua, nhập KT-KT, lập kế hoạch.<br><b>Chuyên viên:</b> cập nhật công tác mình chủ trì/phối hợp, đăng ký thêm giờ và lịch của mình.<br><b>Chỉ xem:</b> xem và xuất báo cáo.<br>Lần đầu, mỗi người bấm "Lần đầu đăng nhập? Tạo mật khẩu" để tự đặt mật khẩu. Quên mật khẩu: Tổ trưởng vào Firebase › Authentication xóa tài khoản đó để người dùng tạo lại.</div>
  ${isAdmin()?`<details style="margin-top:10px"><summary><b>Rules bảo mật Firestore</b> (dán vào Firebase › Firestore › Rules)</summary><textarea id="rulesTxt" rows="14" readonly style="width:100%;font-family:monospace;font-size:11px">${esc(rulesText())}</textarea><button class="btn s" onclick="copyRules()">Sao chép Rules</button></details>`:''}
  </div></div>`}
